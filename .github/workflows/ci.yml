name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Package VSIX
        run: npx @vscode/vsce package

  # The npm ecosystem is a separate package under npm/, with its own
  # dependencies and test suite. It ships as its own extension, so it is
  # verified separately rather than through the root scripts.
  test-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: npm/.nvmrc
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm --prefix npm ci --ignore-scripts
      - run: npm --prefix npm run check
      - name: Package VSIX
        run: npx @vscode/vsce package
        working-directory: npm
