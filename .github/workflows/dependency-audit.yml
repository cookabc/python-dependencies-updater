name: Dependency audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 直接下载官方预编译二进制，避免 go install 现场编译（含整个 Go 工具链）。
      - name: Install osv-scanner (prebuilt)
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$url"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" \
            | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan committed lockfiles
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --no-resolve --no-call-analysis=go,rust \
            -L package-lock.json --format json --output-file "$RUNNER_TEMP/osv-results.json"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/osv-results.json
          if-no-files-found: warn
