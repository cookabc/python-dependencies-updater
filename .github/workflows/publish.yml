name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx @biomejs/biome check src
      - run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath *.vsix --skip-duplicate -p "$VSCE_PAT"
            exit 0
          fi
          # Trusted publishing (OIDC): needs a trusted publishing policy for
          # this repo + workflow on the Marketplace publisher page
          if npx @vscode/vsce publish --packagePath *.vsix --skip-duplicate --oidc; then
            exit 0
          fi
          echo "::error::Marketplace publication failed. Check the trusted publishing policy or VSCE_PAT secret."
          exit 1

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish --packagePath *.vsix --skip-duplicate -p "$OVSX_PAT"
            exit 0
          fi
          # Trusted publishing (OIDC): needs this repo + workflow registered
          # under the namespace's trusted publishers on OpenVSX
          if npx ovsx publish --packagePath *.vsix --skip-duplicate --trusted-publishing; then
            exit 0
          fi
          echo "::error::OpenVSX publication failed. Check the trusted publisher registration or OVSX_PAT secret."
          exit 1

      - name: Create GitHub Release with the VSIX
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v pat="## [$VERSION]" 'index($0, pat) {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            *.vsix
