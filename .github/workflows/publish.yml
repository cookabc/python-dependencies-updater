name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx @biomejs/biome check src
      - run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish -p "$VSCE_PAT"
            exit 0
          fi
          # Trusted publishing (OIDC): needs a trusted publishing policy for
          # this repo + workflow on the Marketplace publisher page
          if npx @vscode/vsce publish --oidc; then
            exit 0
          fi
          echo "::warning::Marketplace publish skipped - register a trusted publishing policy for this repo/workflow on the Marketplace, or set the VSCE_PAT secret"

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish -p "$OVSX_PAT"
            exit 0
          fi
          # Trusted publishing (OIDC): needs this repo + workflow registered
          # under the namespace's trusted publishers on OpenVSX
          if npx ovsx publish --trusted-publishing; then
            exit 0
          fi
          echo "::warning::OpenVSX publish skipped - register this repo/workflow as a trusted publisher on OpenVSX, or set the OVSX_PAT secret"

      - name: Create GitHub Release with the VSIX
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v pat="## [$VERSION]" 'index($0, pat) {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            *.vsix
