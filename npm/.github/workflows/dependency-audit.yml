name: Dependency audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Scan committed lockfiles
        run: |
          GOBIN="$RUNNER_TEMP/osv-bin" go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          "$RUNNER_TEMP/osv-bin/osv-scanner" scan source --no-resolve --no-call-analysis=go,rust -L package-lock.json --format json --output-file "$RUNNER_TEMP/osv-results.json"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: ${ runner.temp }/osv-results.json
          if-no-files-found: warn
